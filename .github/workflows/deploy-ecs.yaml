name: Deploy to ECS (Reusable)

on:
  workflow_call:
    inputs:
      service_name:
        description: "ECS service name. Also used as the task definition family name."
        required: true
        type: string

      cluster:
        description: "ECS cluster name"
        required: true
        type: string

      image_uri:
        description: "Full image URI to deploy (registry/repo:tag)"
        required: true
        type: string

      container_name:
        description: "Container name to update image for. Defaults to service_name."
        required: false
        type: string
        default: ""

      runner:
        required: false
        type: string
        default: common-runner

      aws_region:
        required: false
        type: string
        default: eu-central-1

      wait_for_service_stability:
        required: false
        type: boolean
        default: true

    secrets:
      role_to_assume:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Install AWS CLI
        run: |
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - name: Register new task definition and update service
        env:
          CONTAINER: ${{ inputs.container_name || inputs.service_name }}
        run: |
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition ${{ inputs.service_name }} \
            --query taskDefinition \
            --output json)

          # If the task definition has secrets, rebuild the array dynamically
          # from all keys currently in the secret so no manual task def edits are needed
          HAS_SECRETS=$(echo "$TASK_DEF" | jq -r '
            if (.containerDefinitions[0].secrets // []) | length > 0
            then "true" else "false" end
          ')

          if [ "$HAS_SECRETS" = "true" ]; then
            SECRET_ARN=$(echo "$TASK_DEF" | jq -r '
              .containerDefinitions[0].secrets[0].valueFrom
              | split(":")[:-3]
              | join(":")
            ')

            NEW_SECRETS=$(aws secretsmanager get-secret-value \
              --secret-id "$SECRET_ARN" \
              --query SecretString \
              --output text | jq -r --arg arn "$SECRET_ARN" '
                to_entries | map({name: .key, valueFrom: ($arn + ":" + .key + "::")})
              ')

            NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
              --arg IMAGE "${{ inputs.image_uri }}" \
              --arg CONTAINER "$CONTAINER" \
              --argjson SECRETS "$NEW_SECRETS" '
              ($IMAGE | split("/") | last | split(":") | first) as $IMAGE_NAME |
              .containerDefinitions |= map(
                if .name == $CONTAINER then
                  .image = $IMAGE | .secrets = $SECRETS
                elif (.image | split("/") | last | split(":") | first) == $IMAGE_NAME then
                  .image = $IMAGE
                  | if ((.secrets // []) | length > 0) then .secrets = $SECRETS else . end
                elif (.secrets // []) | length > 0 then
                  .secrets = $SECRETS
                else . end
              )
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
            ')
          else
            NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
              --arg IMAGE "${{ inputs.image_uri }}" \
              --arg CONTAINER "$CONTAINER" '
              ($IMAGE | split("/") | last | split(":") | first) as $IMAGE_NAME |
              .containerDefinitions |= map(
                if .name == $CONTAINER or (.image | split("/") | last | split(":") | first) == $IMAGE_NAME
                then .image = $IMAGE
                else . end
              )
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
            ')
          fi

          NEW_REVISION=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          aws ecs update-service \
            --cluster ${{ inputs.cluster }} \
            --service ${{ inputs.service_name }} \
            --task-definition "$NEW_REVISION" \
            --force-new-deployment

      - name: Wait for service stability
        if: ${{ inputs.wait_for_service_stability }}
        run: |
          aws ecs wait services-stable \
            --cluster ${{ inputs.cluster }} \
            --services ${{ inputs.service_name }} || {
            echo "::error::Deployment failed. Last ECS service events:"
            aws ecs describe-services \
              --cluster ${{ inputs.cluster }} \
              --services ${{ inputs.service_name }} \
              --query 'services[0].events[:5].[createdAt,message]' \
              --output text
            exit 1
          }
